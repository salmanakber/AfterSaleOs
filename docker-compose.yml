services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aftersale
      POSTGRES_PASSWORD: aftersale
      POSTGRES_DB: aftersale
    ports:
      - "5432:5432"
    volumes:
      - aftersale_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aftersale_redis:/data

volumes:
  aftersale_pgdata:
  aftersale_redis:
