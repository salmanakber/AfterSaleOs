# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

name = "AfterSale OS"
client_id = "162e093e6596aeaa735ebcc652bb52fc"
application_url = "https://aftersale.tidyflowapp.com"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_customers,write_draft_orders"

[auth]
redirect_urls = [
  "https://aftersale.tidyflowapp.com/api/auth/callback"
]

[app_proxy]
url = "https://aftersale.tidyflowapp.com/apps/aftersale"
subpath = "aftersale"
prefix = "apps"

[webhooks]
api_version = "2025-01"

  # Topics that do NOT require Protected Customer Data approval.
  [[webhooks.subscriptions]]
  topics = [
    "app/uninstalled",
    "app_subscriptions/update",
    "products/create",
    "products/update"
  ]
  uri = "/api/webhooks/shopify"

  # Mandatory privacy webhooks (App Store). Keep these.
  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]
  uri = "/api/webhooks/shopify"

  # Re-enable AFTER Partners → App → API access → Protected customer data is approved:
  # [[webhooks.subscriptions]]
  # topics = [
  #   "orders/create",
  #   "orders/updated",
  #   "orders/cancelled",
  #   "refunds/create",
  #   "customers/update"
  # ]
  # uri = "/api/webhooks/shopify"

[pos]
embedded = false

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true
